<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar Plato - Epicentro Gourmet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #17258f;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .container {
            max-width: 1050px;
            margin: 40px auto;
            padding: 0 25px 50px;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #6d6d6d;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 3px 14px rgba(0, 0, 0, 0.07);
        }

        .card h3 {
            font-size: 20px;
            margin-bottom: 22px;
            color: #17258f;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input,
        select {
            height: 45px;
            border: 1px solid #d7d9e0;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 14px;
            background: #fafafa;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #243bff;
            background: white;
            box-shadow: 0 0 0 3px rgba(36, 59, 255, 0.10);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
        }

        .checkbox-group label {
            margin: 0;
        }

        .field-error {
            color: #b42318;
            font-size: 12px;
            margin-top: 6px;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 9px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .alert-error {
            background: #fff0f0;
            color: #b42318;
            border: 1px solid #ffd0cc;
        }

        .alert-success {
            background: #effbf3;
            color: #17783c;
            border: 1px solid #c8efd4;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-secondary {
            background: #e9eaf0;
            color: #333;
        }

        .btn-primary {
            background: #17258f;
            color: white;
        }

        .btn-primary:hover {
            background: #243bff;
        }

        .conditional-section {
            display: none;
        }

        .section-note {
            color: #777;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        @media (max-width: 750px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 16px 20px;
            }

            .container {
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <h1>Epicentro Gourmet</h1>

    <a th:href="${homePath}">
        ← Volver a festivales
    </a>

</nav>


<main class="container">

    <div class="page-header">

        <h2 th:text="${edicion} ? 'Modificar Plato' : 'Registrar Platos'">
            Registrar Platos
        </h2>

        <p>
            <span th:text="${edicion} ? 'Actualizá los datos del plato.' : 'Registrá un nuevo plato y sus características.'">
                Registrá un nuevo plato y sus características.
            </span>
        </p>

    </div>


    <!-- ERROR GENERAL -->
    <div
            th:if="${errorGeneral}"
            class="alert alert-error"
            th:text="${errorGeneral}">
    </div>


    <!-- ÉXITO -->
    <div
            th:if="${mensajeExito}"
            class="alert alert-success"
            th:text="${mensajeExito}">
    </div>


    <form
            th:action="${edicion} ? @{/plato/{idPlato}/editar(idPlato=${registroPlato.idPlato})} : @{/plato/agregar}"
            th:object="${registroPlato}"
            method="post">

        <input type="hidden"
               th:if="${edicion}"
               th:field="*{idPlato}">

        <section class="card">

            <h3>1. Datos del Plato</h3>

            <p class="section-note">
                Completá los datos con los que deseas registrar el plato.
            </p>

            <div class="form-grid">


                <div class="form-group">

                    <label for="nombre">
                        Nombre
                    </label>

                    <input
                            type="text"
                            id="nombre"
                            th:field="*{nombre}"
                            placeholder="Ej: Milanesa con papas fritas">


                    <span
                            class="field-error"
                            th:if="${#fields.hasErrors('nombre')}"
                            th:errors="*{nombre}">
                    </span>

                </div>


                <div class="form-group">

                    <label for="precioVenta">
                        Precio de venta ($)
                    </label>

                    <input
                            type="number"
                            id="precioVenta"
                            th:field="*{precioVenta}"
                            required
                            min="0"
                            step="0.01"
                            placeholder="0.00">

                    <span
                            class="field-error"
                            th:if="${#fields.hasErrors('precioVenta')}"
                            th:errors="*{precioVenta}">
                    </span>

                </div>


                <div class="form-group">

                    <label for="costoProduccion">
                        Costo de producción ($)
                    </label>

                    <input
                            type="number"
                            id="costoProduccion"
                            th:field="*{costoProduccion}"
                            required
                            min="0"
                            step="0.01"
                            placeholder="0.00">

                    <span
                            class="field-error"
                            th:if="${#fields.hasErrors('costoProduccion')}"
                            th:errors="*{costoProduccion}">
                    </span>

                </div>
            </div>

            <div class="actions">

                <a
                        th:href="@{/plato/listar}"
                        class="btn btn-secondary">
                    Cancelar
                </a>

                <button
                        type="submit"
                        class="btn btn-primary">

                    <span th:text="${edicion} ? 'Guardar cambios' : 'Registrar plato'">
                        Registrar plato
                    </span>

                </button>

            </div>

        </section>

    </form>

</main>

</body>
</html>
