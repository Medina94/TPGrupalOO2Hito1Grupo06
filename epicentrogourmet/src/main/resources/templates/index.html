<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Festivales - Epicentro Gourmet</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        .navbar {
            background: #17258f;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-area span {
            font-size: 14px;
        }

        .logout-button {
            background: white;
            color: #17258f;
            border: none;
            padding: 9px 15px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .logout-button:hover {
            background: #ededed;
        }

        .container {
            max-width: 1150px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #6d6d6d;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .card-header h3 {
            font-size: 20px;
        }

        .cantidad {
            background: #eef0ff;
            color: #17258f;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 13px;
            background: #f1f2f7;
            color: #444;
            font-size: 14px;
        }

        td {
            padding: 15px 13px;
            border-bottom: 1px solid #e7e7e7;
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafaff;
        }

        .empty-message {
            padding: 35px;
            text-align: center;
            color: #777;
        }

        @media (max-width: 750px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                margin-top: 25px;
            }

            table {
                font-size: 12px;
            }

            th,
            td {
                padding: 10px 7px;
            }
        }
    </style>
</head>

<body>

    <!-- BARRA SUPERIOR -->
    <nav class="navbar">

        <h1>Epicentro Gourmet</h1>

        <div class="user-area">

            <span>
                Usuario:
                <strong th:text="${username}">usuario</strong>
            </span>

            <form th:action="@{/logout}" method="post">
                <button
                    type="submit"
                    class="logout-button">
                    Cerrar sesión
                </button>
            </form>

        </div>

    </nav>


    <!-- CONTENIDO -->
    <main class="container">

        <div class="header">

            <h2>Festivales</h2>

            <p>
                Consultá los festivales registrados en Epicentro Gourmet.
            </p>

        </div>


        <section class="card">

            <div class="card-header">

                <h3>Listado de festivales</h3>

                <span
                    class="cantidad"
                    th:text="${#lists.size(festivales)} + ' festivales'">
                    0 festivales
                </span>

            </div>


            <!-- SI NO HAY FESTIVALES -->
            <div
                class="empty-message"
                th:if="${#lists.isEmpty(festivales)}">

                No hay festivales registrados actualmente.

            </div>


            <!-- SI HAY FESTIVALES -->
            <table th:if="${!#lists.isEmpty(festivales)}">

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Temporada</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de fin</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="festival : ${festivales}">

                        <td th:text="${festival.nombre}">
                            Festival
                        </td>

                        <td th:text="${festival.temporada}">
                            Temporada
                        </td>

                        <td th:text="${festival.fechaInicio}">
                            2026-01-01
                        </td>

                        <td th:text="${festival.fechaFin}">
                            2026-01-10
                        </td>

                    </tr>

                </tbody>

            </table>

        </section>

    </main>

</body>

</html>
